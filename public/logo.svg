<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Great+Vibes&amp;display=swap');
      .bg-k { 
        fill: #8c735a; 
        font-family: 'Cormorant Garamond', serif; 
        font-size: 110px; 
        font-weight: 600; 
        opacity: 0.5;
      }
      .fg-text { 
        fill: #EDECE8; 
        font-family: 'Great Vibes', cursive; 
        font-size: 56px; 
        letter-spacing: 2px;
        filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3));
      }
    </style>
  </defs>
  <!-- Centered K Background -->
  <text x="50%" y="75%" text-anchor="middle" dominant-baseline="middle" class="bg-k">K</text>
  
  <!-- Centered Script Text -->
  <text x="50%" y="68%" text-anchor="middle" dominant-baseline="middle" class="fg-text">Kylee Nail Spa</text>
</svg>
