<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&amp;family=Great+Vibes&amp;display=swap');
      .bg-k { 
        fill: #8c735a; 
        font-family: 'Cormorant Garamond', serif; 
        font-size: 140px; 
        font-weight: 700; 
        opacity: 0.8; 
      }
      .script-text { 
        fill: #D8CFC4; 
        font-family: 'Great Vibes', cursive; 
        font-size: 64px; 
        letter-spacing: 1px;
        filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
      }
      .nail-text {
        fill: #D8CFC4;
        font-family: 'Great Vibes', cursive;
        font-size: 48px; /* Smaller as requested */
        letter-spacing: 1px;
        filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
      }
    </style>
  </defs>
  <!-- Centered K Background - More Visible -->
  <text x="50%" y="75%" text-anchor="middle" dominant-baseline="middle" class="bg-k">K</text>
  
  <!-- "Kylee" - Left -->
  <text x="32%" y="65%" text-anchor="end" dominant-baseline="middle" class="script-text">Kylee</text>
  
  <!-- "Nail" - Middle of K, Smaller -->
  <text x="50%" y="65%" text-anchor="middle" dominant-baseline="middle" class="nail-text">Nail</text>
  
  <!-- "Spa" - Right -->
  <text x="68%" y="65%" text-anchor="start" dominant-baseline="middle" class="script-text">Spa</text>
</svg>
